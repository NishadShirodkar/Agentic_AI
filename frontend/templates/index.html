<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-left" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-right" aria-hidden="true"></div>

    <main class="page">
      <header class="hero reveal">
        <p class="badge">Agentic AI Research Suite</p>
        <h1>Research Forge</h1>
        <p class="subtitle">
          Ask a focused question. Get a synthesized, source-aware answer with structured insights.
        </p>
      </header>

      <section class="panel reveal delay-1">
        <form id="research-form" class="query-form">
          <label for="query">Research Query</label>
          <div class="query-row">
            <textarea
              id="query"
              name="query"
              rows="3"
              placeholder="Compare the top 3 open-source vector databases for RAG systems"
              required
            ></textarea>
            <button id="submit-btn" type="submit">Run Analysis</button>
          </div>
        </form>

        <div id="status" class="status hidden"></div>
      </section>

      <section id="results" class="results hidden reveal delay-2" aria-live="polite">
        <article class="card wide">
          <h2>Short Answer</h2>
          <p id="short-answer" class="lead"></p>
        </article>

        <div class="grid-two">
          <article class="card">
            <h3>Key Findings</h3>
            <ul id="key-findings"></ul>
          </article>
          <article class="card">
            <h3>Sources</h3>
            <ul id="sources"></ul>
          </article>
        </div>

        <div class="grid-two">
          <article class="card">
            <h3>Confidence</h3>
            <p id="confidence" class="pill"></p>
            <p id="source-count" class="muted"></p>
          </article>
          <article class="card">
            <h3>Execution Plan</h3>
            <ul id="plan-steps"></ul>
          </article>
        </div>

        <div class="grid-two">
          <article class="card">
            <h3>Limitations</h3>
            <ul id="limitations"></ul>
          </article>
          <article class="card">
            <h3>Next Steps</h3>
            <ul id="next-steps"></ul>
          </article>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
